name: Deploy Web to GitHub Pages

# 1. Disparador: Se ejecuta cada vez que hagas push a la rama main
on:
  push:
    branches:
      - main
    # Opcional: Solo se dispara si hay cambios en la carpeta Web
    paths:
      - 'Web/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 2. Descargar el código del repositorio en la máquina virtual de GitHub
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3. Desplegar la carpeta específica a la rama gh-pages
      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Web # AQUÍ indicas que solo suba el contenido de la carpeta Web
